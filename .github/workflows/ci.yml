name: CRM candidate quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-sha-quality:
    name: Exact-SHA quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: packages/crm
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact clean candidate
        shell: bash
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install pinned Gitleaks
        shell: bash
        working-directory: .
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Secret scan
        shell: bash
        working-directory: .
        run: |
          snapshot="${RUNNER_TEMP}/candidate-source"
          report="${RUNNER_TEMP}/gitleaks-report.json"
          mkdir -p "${snapshot}"
          git archive HEAD | tar -x -C "${snapshot}"
          set +e
          gitleaks dir --no-banner --report-format json --report-path "${report}" "${snapshot}"
          scan_status=$?
          set -e
          if [[ ${scan_status} -gt 1 ]]; then exit "${scan_status}"; fi
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types \
            packages/crm/scripts/validate-gitleaks-report.ts \
            --report "${report}" \
            --snapshot-root "${snapshot}" \
            --baseline packages/crm/scripts/gitleaks-baseline.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Full tests
        run: npm test

      - name: Resolve migration comparison base
        shell: bash
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            migration_base_sha="$(git merge-base "${PR_BASE_SHA}" "${CANDIDATE_SHA}")"
          else
            migration_base_sha="${PUSH_BEFORE_SHA}"
          fi
          git cat-file -e "${migration_base_sha}^{commit}"
          git merge-base --is-ancestor "${migration_base_sha}" "${CANDIDATE_SHA}"
          echo "MIGRATION_BASE_SHA=${migration_base_sha}" >> "${GITHUB_ENV}"

      - name: Replay complete migration history and run database tests
        shell: bash
        env:
          MIGRATION_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        run: bash scripts/run-supabase-ci.sh

      - name: Validate any tracked release manifests
        shell: bash
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types \
            scripts/release-manifest.ts validate-tree \
            --repo ../..

      - name: Build
        run: npm run build

      - name: Assert candidate remained clean
        shell: bash
        working-directory: .
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
