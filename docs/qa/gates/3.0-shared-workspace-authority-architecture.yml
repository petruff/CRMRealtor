nfr_validation:
  security:
    status: PASS
    notes: >-
      RLS, composite FKs, owner-only RPCs, server-only intake binding and CLI
      rejection of service-role/secret keys form defense in depth. Authenticated
      workspace health refuses sample/signed-out and assistant contexts.
  reliability:
    status: PASS
    notes: >-
      Migration assertions fail closed and scope resolution rejects ambiguous or
      revoked authority. Runtime health probes every migrated tenant table with
      its valid key column and returns attention when any canonical query fails.
  performance:
    status: PASS
    notes: >-
      Workspace-scoped indexes cover the primary tenant access paths; bounded
      membership lookups and composite keys avoid unscoped scans in reviewed code.
  scalability:
    status: PASS
    notes: >-
      Canonical workspace keys and membership-derived access can extend to later
      persistent domains without reintroducing owner-bound tenancy. Multi-workspace
      selection remains intentionally unsupported and fails closed.
  maintainability:
    status: PASS
    notes: >-
      WorkspaceScope is required at repository construction, service-role clients
      remain behind a binding resolver, and sample/live implementations share the
      authority interfaces.

