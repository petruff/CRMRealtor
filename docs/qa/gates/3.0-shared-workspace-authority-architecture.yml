tradeoffs:
  - decision: 'Retain legacy owner_id during the compatibility window.'
    benefit: 'Preserves existing relationships and reduces forward-migration risk.'
    cost: >-
      Every compatibility write must keep deriving owner_id from the verified
      active owner; allowing caller input would recreate dual authority.
  - decision: 'Use security-definer helpers/RPCs for membership authority.'
    benefit: 'Avoids recursive RLS and centralizes owner-only mutations.'
    cost: >-
      Search-path hardening, narrow execute grants and scoped application seams
      remain mandatory because service-role/database-owner paths bypass RLS.
  - decision: 'Keep sample mode on the same repository contracts.'
    benefit: 'Preserves route compatibility and makes non-durable behavior testable.'
    cost: >-
      Authentication-sensitive endpoints must not silently reinterpret sample
      authority as a real authenticated owner contract.

