resolved_findings:
  - id: 'SEC-001'
    evidence: 'Automatic intake rejects missing externalId and parser rejects IDs above 255 characters before preview/reservation; route-level 422 tests pass.'
  - id: 'REL-001'
    evidence: 'Plans are aggregated by existing contact and a focused test proves deterministic first-value preservation plus later empty-field enrichment.'
  - id: 'REL-002'
    evidence: 'A failed create-to-link sequence removes the newly created contact; cleanup failure is explicit and cannot be reported as clean success.'
  - id: 'REQ-001'
    evidence: 'Rejected rows enter result.errors and the UI renders warning semantics, partial wording, counts, and row-level reasons.'
  - id: 'TEST-001'
    evidence: 'Seven route tests cover 503, 401, 413, external-ID validation, success, exact/conflicting/in-progress replay, provider failure, malformed JSON, and batch bounds.'
  - id: 'REQ-002'
    evidence: 'Next Server Actions use a 3 MB transport limit while the parser retains the authoritative 2 MB file limit; production build accepts the configuration.'
  - id: 'CLI-001'
    evidence: 'CLI refuses rejected files, supplies deterministic file-row external IDs, and exits non-zero for HTTP 207 or ok:false.'
  - id: 'DOC-001'
    evidence: 'Connections and operator docs describe Mailchimp CSV import as current and direct synchronization as future work.'

nfr_validation:
  security:
    status: PASS
    notes: 'Constant-time bearer validation, fail-closed configuration, fixed owner binding, streaming bounds, mandatory external identity, RLS, composite ownership FKs, and explicit privileged owner filters are present.'
  reliability:
    status: PASS
    notes: 'Deterministic same-target collapse, receipt claiming/replay, note idempotency, partial receipts, and verified create-link compensation protect retry behavior.'
  performance:
    status: PASS
    notes: 'Bounded synchronous processing is proportionate to the approved 200-500 contact dataset and 1,000-row maximum.'
  privacy:
    status: PASS
    notes: 'Raw contact payloads are not logged or persisted in receipts, and browser PII remains transient rather than entering URLs or storage.'
  accessibility:
    status: PASS
    notes: 'Keyboard controls, visible focus, 44px actions, responsive table containment, live result messaging, reduced motion, and light/dark themes are retained.'
  maintainability:
    status: PASS
    notes: 'Parser, planner/executor, repository gateway, route, CLI, and React presentation remain separated behind typed boundaries.'

