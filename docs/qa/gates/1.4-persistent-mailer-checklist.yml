requirements_trace:
  - ac: 1
    given_when_then: 'Given valid server input, when the Realtor creates a named physical-mail campaign, then the repository persists its trimmed name and optional notes and the UI stays explicitly postcard/letter-oriented.'
    evidence: ['mailer command validation tests', 'create action', '390px production runtime']
  - ac: 2
    given_when_then: 'Given a selected campaign, when a contact toggle is submitted, then its contact-specific checkbox exposes pending state and reports success or error without optimistic false success.'
    evidence: ['MailerSendToggle source review', 'production runtime mark/unmark flow']
  - ac: 3
    given_when_then: 'Given repeated mark or unmark requests, when commands execute, then marking preserves the first calendar date and clearing remains idempotent.'
    evidence: ['mailer-commands.test.ts', 'memory and Supabase repository review']
  - ac: 4
    given_when_then: 'Given multiple campaigns and contacts, when navigation or reload occurs, then sends and summary counts are reconstructed from repository state without losing another campaign history.'
    evidence: ['summarizeMailer test', 'memory HMR persistence test', 'production runtime reload']
  - ac: 5
    given_when_then: 'Given malformed or cross-owner input, when a command reaches the data boundary, then validation, owner-scoped target checks, and composite FKs reject it without reporting success.'
    evidence: ['command rejection tests', 'Supabase owner-filter test', 'PostgreSQL cross-owner rejection']
  - ac: 6
    given_when_then: 'Given demo or authenticated live mode, when mailer operations run, then the same repository contract supplies observable list/create/mark/unmark behavior and every live operation binds the fixed owner.'
    evidence: ['repository implementations', 'HMR test', 'owner-scope harness']
  - ac: 7
    given_when_then: 'Given the 0001/0002 schema and an existing valid send, when migration 0003 applies, then owner scope and same-owner FKs are added while the original send date and uniqueness remain intact.'
    evidence: ['PostgreSQL 17 migration exercise', 'migration source review']
  - ac: 8
    given_when_then: 'Given no browser runtime, when explicit CLI commands execute, then shared application/repository code returns JSON and malformed or unconfigured live operations exit non-zero.'
    evidence: ['independent CLI list/create/mark/unmark smoke', 'malformed and live fail-closed smoke']
  - ac: 9
    given_when_then: 'Given a 390px viewport and light/dark themes, when the campaign workflow runs, then system typography, tokenized surfaces, 44px controls, focus/reduced-motion rules, and horizontal containment remain usable.'
    evidence: ['source review', '390px Playwright flow', 'dark-theme toggle', 'zero console errors']
  - ac: 10
    given_when_then: 'Given the complete CRM package, when regression gates execute, then lint, typecheck, 85 tests, CLI smoke, production build, migration checks, and responsive runtime all pass.'
    evidence: ['independent QA execution on 2026-08-10']

risk_summary:
  highest_score: 4
  highest_risk: 'Live Supabase and migration regressions are not yet automated in CI'

nfr_validation:
  security:
    status: PASS
    notes: 'Server-side validation, explicit owner filters/payloads, same-owner target checks, composite database FKs, owner-bound RLS, and sanitized browser failures prevent cross-owner linkage and false success.'
  performance:
    status: PASS
    notes: 'The bounded 200-500 contact workflow uses no new dependency or background service; the optimized /mailers route is 111 kB first-load with 103 kB shared.'
  reliability:
    status: PASS
    notes: 'First-date-preserving idempotency, explicit failure propagation, demo HMR persistence, successful reload behavior, and a real PostgreSQL migration exercise cover the principal persistence risks.'
  accessibility:
    status: PASS
    notes: 'Contact-specific checkbox names, 44px targets, keyboard-native buttons, visible global focus, reduced-motion rules, live status/error semantics, responsive containment, and both themes are present.'
  maintainability:
    status: PASS
    notes: 'Domain, application, repository, server-action, CLI, migration, and presentation responsibilities remain separated behind typed boundaries and documented operator behavior.'
  privacy:
    status: PASS
    notes: 'Actions log operation/error type only; browser errors do not expose provider detail, campaign notes, form payloads, contact PII, or credentials.'

