tradeoffs:
  - decision: 'Keep one provider-free deterministic service behind CLI and UI adapters.'
    benefit: 'Prevents contract drift and preserves CLI-first operation.'
    cost: >-
      Every additive intent must extend the central fact-key map and semantic
      citation tests before either adapter exposes it.
  - decision: 'Derive next-touch facts without persisting them in the copilot.'
    benefit: 'Preserves Story 2.1 cadence behavior and the strict no-write boundary.'
    cost: >-
      Citations must identify the stored inputs used to derive the date, not
      pretend an in-memory nextTouchAt value was persisted.
  - decision: 'Use a digest for the bounded mailer-send citation identity.'
    benefit: 'Preserves the complete composite-key identity inside the 128-character contract.'
    cost: >-
      The digest is not human-readable; the citation must continue to expose the
      mailerId/contactId/sentOn fact keys and safe mailer target.
  - decision: 'Keep repository scope as tenant authority.'
    benefit: 'Preserves membership-derived RLS and forbidden-record non-disclosure.'
    cost: >-
      New optional repositories need the same two-workspace, revoked-membership
      and sample/live mismatch proof.

